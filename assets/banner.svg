  <text x="66" y="278" fill="#c9d7e6" font-family="Arial, Helvetica, sans-serif" font-size="24">Practical tools. Clear business value.</text>
  <text x="66" y="341" fill="#8ccfff" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">AUTOMATION / DATA / EVENT TECH</text>
