<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Business Automation &amp; AI-Powered Development</title>
  <desc id="desc">A navy and graphite banner with white typography, blue accents and an abstract connected workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#102c48"/>
    </linearGradient>
